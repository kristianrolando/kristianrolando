<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Aldo — Turning ideas into playable worlds</title>
<desc id="desc">A midnight arcade landscape with floating platforms, a pixel character, glowing collectibles, and a violet moon. Kristian Rolando Limantara, game developer working with Unity and C#.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c111d"/><stop offset="1" stop-color="#1b1230"/></linearGradient>
<linearGradient id="moon" x2="0.8" y2="1"><stop stop-color="#e0d4ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="ground" x2="0" y2="1"><stop stop-color="#32305a"/><stop offset="1" stop-color="#151b2e"/></linearGradient>
<linearGradient id="line"><stop stop-color="#bba1ff"/><stop offset="1" stop-color="#70f0c2"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bba1ff" stroke-opacity=".035"/></pattern>
<clipPath id="frame"><rect width="1200" height="500" rx="24"/></clipPath>
<style>
.float{animation:float 5s ease-in-out infinite}.float-late{animation:float 5s ease-in-out -2.5s infinite}.spark{animation:spark 4s ease-in-out infinite}.spark-late{animation:spark 4s ease-in-out -2s infinite}.cursor{animation:cursor 2s step-end infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cursor{0%,65%{opacity:1}66%,100%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.float,.float-late,.spark,.spark-late,.cursor{animation:none}}
</style>
</defs>
