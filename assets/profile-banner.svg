<text x="61" y="157" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-3" fill="#f1f4fc">TURNING IDEAS</text>
<text x="61" y="238" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-3" fill="#f1f4fc">INTO PLAYABLE</text>
<text x="61" y="319" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-3" fill="#bba1ff">WORLDS.</text>
